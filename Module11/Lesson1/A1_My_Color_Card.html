<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Color Card</title>

    <style>
        /*Universal selector*/
        *{
            font-size: 16px;
        }
        /*Element selector*/
        body{
            background-color: rgb(248, 220, 182);
        }
        h1{
            color: blueviolet;
        }
        h2{
            color: blue;
        }
        p{
            color: brown;
        }
        /*Class selector*/
        .my_details{
            color: cadetblue;
            font-weight: bolder;
        }
/*id selector*/
        #card{
           background-color: rgb(192, 210, 30);
        }

    </style>

  </head>

  <body>
    <h1>My Color Card</h1>
    <p style="color: crimson;">Hi! This is my very own webpage.</p>

    <div id="card">
    <h2>About me</h2>
    <p class="my_details">My name is Zeeshan</p>
    <p class="my_details">My Favourite Color is Red</p>
    <p class="my_details">My Favourite Subject is Coding</p>
    <p class="my_details">My Favourite Food is Pizza</p>
    </div>

<h2>My Favourite Things!!!!</h2>
<p>My Favourite Animal is Cat</p>
<p>My Favourite Sport is Cricket</p>
<p>My Favourite movie is Epic</p>


  </body>
</html>
