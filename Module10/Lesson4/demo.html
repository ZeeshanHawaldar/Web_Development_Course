<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <img
      src="rocket.png"
      alt="lauching rocket image"
      width="400"
      height="400"
    />
    <audio controls loop>
      <source src="music.mp3" type="audio/mpeg" />
    </audio>

    <video controls loop poster="party.jpg">
      <source src="ocean.mp4" type="video/mp4" />
    </video>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/5oH9Nr3bKfw?si=5qkMFp1wE0DxNtv2"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
